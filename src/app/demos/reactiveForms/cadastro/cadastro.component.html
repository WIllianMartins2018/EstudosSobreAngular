<div class="container main-container">
    <h4>Demo Cadastro</h4>
    <hr />

    <form novalidate (ngSubmit)="adicionarUsuario()" [formGroup]="cadastroForm">

        <div class="form-horizontal">

            <div class="form-group">
                <label class="col-md-2 control-label" for="nome">Nome Completo</label>
                <div class="col-md-10" style="margin-top: 1%;">
                    <input class="form-control" id="nome" type="text" placeholder="Nome (Requerido)" formControlName="nome"/>
                </div>
            </div>

            <div class="form-group">
                <label class="col-md-2 control-label" for="cpf" style="margin-top: 1%;">CPF</label>
                <div class="col-md-10" style="margin-top: 1%;">
                    <input class="form-control" id="cpf" type="text" placeholder="CPF (Requerido)" formControlName="cpf"/>
                </div>
            </div>

            <div class="form-group">
                <label class="col-md-2 control-label" for="email" style="margin-top: 1%;">E-mail</label>
                <div class="col-md-10" style="margin-top: 1%;">
                    <input class="form-control" id="email" type="email" placeholder="E-mail (Requerido)" formControlName="email" />
                </div>
            </div>

            <div class="form-group">
                <label class="col-md-2 control-label" for="senha" style="margin-top: 1%;">Senha</label>
                <div class="col-md-10" style="margin-top: 1%;">
                    <input class="form-control" id="senha" type="password" placeholder="Senha (Requerido)" formControlName="senha"/>
                </div>
            </div>

            <div class="form-group">
                <label class="col-md-2 control-label" for="senhaConfirmacao" style="margin-top: 1%;">Confirmar Senha</label>
                <div class="col-md-10" style="margin-top: 1%;">
                    <input class="form-control" id="senhaConfirmacao" type="password" placeholder="Confirmar Senha (Requerido)" formControlName="senhaConfirmacao"/>
                </div>
            </div>

            <div class="form-group">
               <div class="col-md-4 col-md-offset-2" style="margin-top: 1%;">
                    <span>
                        <button class="btn btn-success" id="Registrar" type="submit">Registrar</button>
                    </span>
               </div>
            </div>

        </div>

    </form>
</div>
